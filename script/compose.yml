    environment:
      DASHBOARD_SERVER_PORT: 8112
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/resto
      SECURITY_INTERNAL_AUTH_SECRET: $INTERNAL_AUTH_SECRET
      ACCESS_SERVICE_URL: http://access-service:8120
      ORGANIZATION_SERVICE_URL: http://organization-service:8102
      MENU_SERVICE_URL: http://menu-service:8105
      TABLE_SERVICE_URL: http://table-service:8106
      ORDER_SERVICE_URL: http://order-service:8107

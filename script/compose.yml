      context: ../
      dockerfile: menu-service/Dockerfile
    restart: always
    depends_on:
      migrations:
        condition: service_completed_successfully
    environment:
      MENU_DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-resto}?currentSchema=resto_menu
      MENU_DB_USERNAME: $POSTGRES_USER
      MENU_DB_PASSWORD: $POSTGRES_PASSWORD
      JPA_DDL_AUTO: $JPA_DDL_AUTO
      MENU_SERVER_PORT: 8105
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/resto
      SECURITY_INTERNAL_AUTH_SECRET: $INTERNAL_AUTH_SECRET
      MENU_STORAGE_DIR: /data/menu-images
      MENU_PUBLIC_BASE_URL: $MENU_PUBLIC_BASE_URL
      ORGANIZATION_SERVICE_URL: http://organization-service:8102
      MENU_SERVICE_URL: http://menu-service:8105
      TABLE_SERVICE_URL: http://table-service:8106
      ORDER_SERVICE_URL: http://order-service:8107
      SETTING_SERVICE_URL: http://setting-service:8111
      TZ: Asia/Baku
    networks:
      - resto_net
    ports:
      - "8105:8105"
    volumes:
      - menu_images:/data/menu-images


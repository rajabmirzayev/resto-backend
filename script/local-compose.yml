services:
  db:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_USER: $POSTGRES_USER
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
      POSTGRES_DB: $POSTGRES_DB
      TZ: Asia/Baku
    networks:
      - resto_net
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.2
    restart: always
    command: start-dev --import-realm
    volumes:
      - ./resto-realm.json:/opt/keycloak/data/import/resto-realm.json
      - ./bootstrap-kc.sh:/tmp/scripts/bootstrap-kc.sh
    networks:
      - resto_net
    ports:
      - "8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: $KC_BOOTSTRAP_ADMIN_USERNAME
      KC_BOOTSTRAP_ADMIN_PASSWORD: $KC_BOOTSTRAP_ADMIN_PASSWORD
      KC_DB: $KC_DB
      KC_DB_URL: $KC_DB_URL
      KC_DB_USERNAME: $KC_DB_USERNAME
      KC_DB_PASSWORD: $KC_DB_PASSWORD
      KC_HEALTH_ENABLED: $KC_HEALTH_ENABLED
      AUTH_KEYCLOAK_CLIENT_SECRET: $AUTH_KEYCLOAK_CLIENT_SECRET
      PLATFORM_BOOTSTRAP_EMAIL: $PLATFORM_BOOTSTRAP_EMAIL
      PLATFORM_BOOTSTRAP_PASSWORD: $PLATFORM_BOOTSTRAP_PASSWORD
      PLATFORM_BOOTSTRAP_ORG_ID: $PLATFORM_BOOTSTRAP_ORG_ID
      TZ: Asia/Baku
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 'HTTP/1.1 200'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s

  pgadmin:
    image: dpage/pgadmin4:9.11
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: $PGADMIN_DEFAULT_EMAIL
      PGADMIN_DEFAULT_PASSWORD: $PGADMIN_DEFAULT_PASSWORD
      TZ: Asia/Baku
    networks:
      - resto_net
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db

  valkey:
    image: valkey/valkey:9
    restart: always
    networks:
      - resto_net
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data

networks:
  resto_net:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
  valkey_data:

services:
  db:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_USER: $POSTGRES_USER
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
      POSTGRES_DB: $POSTGRES_DB
      TZ: Asia/Baku
    networks:
      - tabler_net
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.2
    restart: always
    command: start-dev --import-realm
    volumes:
      - ./tabler-realm.json:/opt/keycloak/data/import/tabler-realm.json
      - ./bootstrap-kc.sh:/tmp/script/bootstrap-kc.sh
    networks:
      - tabler_net
    ports:
      - "8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: $KC_BOOTSTRAP_ADMIN_USERNAME
      KC_BOOTSTRAP_ADMIN_PASSWORD: $KC_BOOTSTRAP_ADMIN_PASSWORD
      KC_DB: $KC_DB
      KC_DB_SCHEMA: $KC_DB_SCHEMA
      KC_DB_URL: $KC_DB_URL
      KC_DB_USERNAME: $KC_DB_USERNAME
      KC_DB_PASSWORD: $KC_DB_PASSWORD
      KC_HEALTH_ENABLED: $KC_HEALTH_ENABLED
      TZ: Asia/Baku
    depends_on:
      - db
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:9.11
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: $PGADMIN_DEFAULT_EMAIL
      PGADMIN_DEFAULT_PASSWORD: $PGADMIN_DEFAULT_PASSWORD
      TZ: Asia/Baku
    networks:
      - tabler_net
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db

  valkey:
    image: valkey/valkey:9
    restart: always
    networks:
      - tabler_net
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data

  seaweedfs:
    image: chrislusf/seaweedfs:4.12
    restart: always
    command: mini -dir=/data -ip.bind=0.0.0.0 -s3 -admin.user=$SEAWEED_ADMIN_USERNAME -admin.password=$SEAWEED_ADMIN_PASSWORD
    environment:
      AWS_ACCESS_KEY_ID: $SW_AWS_ACCESS_KEY_ID
      AWS_SECRET_ACCESS_KEY: $SW_AWS_SECRET_ACCESS_KEY
      SEAWEED_ADMIN_USERNAME: $SEAWEED_ADMIN_USERNAME
      SEAWEED_ADMIN_PASSWORD: $SEAWEED_ADMIN_PASSWORD
      SEAWEED_BUCKET_NAME: $SEAWEED_BUCKET_NAME
      TZ: Asia/Baku
    networks:
      - tabler_net
    ports:
      - "9333:9333"
      - "8888:8888"
      - "8333:8333"
      - "8181:8181"
      - "7333:7333"
      - "23646:23646"
      - "9340:9340"
    volumes:
      - seaweedfs_data:/data

networks:
  tabler_net:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
  valkey_data:
  seaweedfs_data:

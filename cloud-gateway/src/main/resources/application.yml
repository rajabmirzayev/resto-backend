spring:
  application:
    name: cloud-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  codec:
    max-in-memory-size: 50MB
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 5000
            response-timeout: 30s
          routes:
            - id: auth-management
              uri: ${GW_AUTH_MANAGEMENT_URL:http://localhost:8002}
              predicates:
                - Path=/api/auth-ms/**
            - id: organization-management
              uri: ${GW_ORGANIZATION_URL:http://localhost:8102}
              predicates:
                - Path=/api/organization-ms/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"
            - id: dashboard-management
              uri: ${GW_DASHBOARD_URL:http://localhost:8112}
              predicates:
                - Path=/api/dashboard-ms/**
            - id: report-management
              uri: ${GW_REPORT_URL:http://localhost:8113}
              predicates:
                - Path=/api/report-ms/**
            - id: customer-management
              uri: ${GW_CUSTOMER_URL:http://localhost:8110}
              predicates:
                - Path=/api/customer-ms/**
            - id: waiter-management
              uri: ${GW_WAITER_URL:http://localhost:8109}
              predicates:
                - Path=/api/waiter-ms/**
            - id: kitchen-management
              uri: ${GW_KITCHEN_URL:http://localhost:8108}
              predicates:
                - Path=/api/kitchen-ms/**
            - id: order-management
              uri: ${GW_ORDER_URL:http://localhost:8107}
              predicates:
                - Path=/api/order-ms/**
            - id: setting-management
              uri: ${GW_SETTING_URL:http://localhost:8111}
              predicates:
                - Path=/api/setting-ms/**
            - id: role-management
              uri: ${GW_ROLE_URL:http://localhost:8104}
              predicates:
                - Path=/api/role-ms/**
            - id: user-management
              uri: ${GW_USER_URL:http://localhost:8103}
              predicates:
                - Path=/api/user-ms/**
            - id: menu-management
              uri: ${GW_MENU_URL:http://localhost:8105}
              predicates:
                - Path=/api/menu-ms/**
            - id: table-management
              uri: ${GW_TABLE_URL:http://localhost:8106}
              predicates:
                - Path=/api/table-ms/**
          default-filters:
            - PreserveHostHeader
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"
            - name: RequestSize
              args:
                maxSize: 10485760

security:
  oauth2:
    issuer-uri: ${KC_ISSUER_URI:http://localhost:8080/realms/tabler}
    audience: ${KC_AUDIENCE:}
    client-id: ${KC_CLIENT_ID:tabler-gateway}

server:
  port: 8001

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

common:
  error:
    service-key: DASHBOARD_MS
spring:
  application:
    name: dashboard-service
  messages:
    basename: messages
service:
  order:
    url: ${ORDER_SERVICE_URL:http://localhost:8107}
  table:
    url: ${TABLE_SERVICE_URL:http://localhost:8106}
  menu:
    url: ${MENU_SERVICE_URL:http://localhost:8105}
  access:
    url: ${ACCESS_SERVICE_URL:http://localhost:8120}

server:
  port: ${DASHBOARD_SERVER_PORT:8112}
  servlet:
    context-path: /api/dashboard-ms
logging:
  level:
    az.flowix.dashboard: DEBUG


security:
  internal-auth:
    secret: ${INTERNAL_AUTH_SECRET:}

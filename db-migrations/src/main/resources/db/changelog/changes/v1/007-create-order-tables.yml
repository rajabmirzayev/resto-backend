databaseChangeLog:
  - changeSet:
      id: 007-create-order-tables
      author: rajabmirzayev
      changes:
        # ==================== orders ====================
        - createTable:
            tableName: orders
            remarks: Customer orders
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_orders
              - column:
                  name: created_by
                  type: UUID
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_by
                  type: UUID
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: table_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: table_number
                  type: INTEGER
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: payment_status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: total_amount
                  type: DECIMAL(12, 2)
                  constraints:
                    nullable: false
              - column:
                  name: waiter_id
                  type: UUID
              - column:
                  name: waiter_name
                  type: VARCHAR(255)
              - column:
                  name: order_source
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: waiter_confirmed
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: confirmed_by
                  type: VARCHAR(255)
              - column:
                  name: customer_photo
                  type: TEXT
              - column:
                  name: payment_method
                  type: VARCHAR(10)
              - column:
                  name: payment_requested
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: cancel_reason
                  type: VARCHAR(500)
              - column:
                  name: org_id
                  type: UUID
                  constraints:
                    nullable: false
        - createIndex:
            tableName: orders
            indexName: idx_order_org
            columns:
              - column:
                  name: org_id
        - createIndex:
            tableName: orders
            indexName: idx_order_table
            columns:
              - column:
                  name: table_id
        - createIndex:
            tableName: orders
            indexName: idx_order_status
            columns:
              - column:
                  name: org_id
              - column:
                  name: status
        - createIndex:
            tableName: orders
            indexName: idx_order_waiter
            columns:
              - column:
                  name: waiter_id
        - createIndex:
            tableName: orders
            indexName: idx_order_created
            columns:
              - column:
                  name: created_at
        - createIndex:
            tableName: orders
            indexName: idx_order_payment
            where: payment_requested = true
            columns:
              - column:
                  name: payment_requested
              - column:
                  name: payment_status

        # ==================== order_items ====================
        - createTable:
            tableName: order_items
            remarks: Order line items
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_order_items
              - column:
                  name: created_by
                  type: UUID
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_by
                  type: UUID
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: order_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: menu_item_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: menu_item_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: DECIMAL(10, 2)
                  constraints:
                    nullable: false
              - column:
                  name: notes
                  type: VARCHAR(500)
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: org_id
                  type: UUID
                  constraints:
                    nullable: false
        - createIndex:
            tableName: order_items
            indexName: idx_order_item_order
            columns:
              - column:
                  name: order_id
        - createIndex:
            tableName: order_items
            indexName: idx_order_item_status
            columns:
              - column:
                  name: order_id
              - column:
                  name: status

databaseChangeLog:
  - changeSet:
      id: 001-create-organization-tables
      author: rajabmirzayev
      changes:
        # ==================== organizations ====================
        - createTable:
            schemaName: resto_organization
            tableName: organizations
            remarks: Organization table (multi-tenant root entity)
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_organizations
              - column:
                  name: created_by
                  type: UUID
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_by
                  type: UUID
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: is_deleted
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: deleted_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: deleted_by
                  type: UUID
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: slug
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_organizations_slug
              - column:
                  name: admin_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: admin_email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: logo_url
                  type: VARCHAR(512)
              - column:
                  name: phone
                  type: VARCHAR(50)
              - column:
                  name: address
                  type: TEXT
        - createIndex:
            schemaName: resto_organization
            tableName: organizations
            indexName: idx_org_slug
            unique: false
            where: is_deleted = false
            columns:
              - column:
                  name: slug
        - createIndex:
            schemaName: resto_organization
            tableName: organizations
            indexName: idx_org_created_at
            columns:
              - column:
                  name: created_at

        # ==================== users ====================
        - createTable:
            schemaName: resto_organization
            tableName: users
            remarks: Local user table (temp until user-service is built)
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_users
              - column:
                  name: created_by
                  type: UUID
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_by
                  type: UUID
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: is_deleted
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: deleted_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: deleted_by
                  type: UUID
              - column:
                  name: keycloak_id
                  type: VARCHAR(255)
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: username
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(255)
              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: role_id
                  type: UUID
              - column:
                  name: org_id
                  type: UUID
              - column:
                  name: avatar
                  type: VARCHAR(512)
              - column:
                  name: is_active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            schemaName: resto_organization
            tableName: users
            columnNames: keycloak_id
            constraintName: uq_users_keycloak_id
        - createIndex:
            schemaName: resto_organization
            tableName: users
            indexName: idx_user_username
            unique: true
            where: is_deleted = false
            columns:
              - column:
                  name: username
        - createIndex:
            schemaName: resto_organization
            tableName: users
            indexName: idx_user_org
            where: is_deleted = false
            columns:
              - column:
                  name: org_id
        - createIndex:
            schemaName: resto_organization
            tableName: users
            indexName: idx_user_role
            columns:
              - column:
                  name: role

        # ==================== roles ====================
        - createTable:
            schemaName: resto_organization
            tableName: roles
            remarks: Local role table (temp until role-service is built)
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_roles
              - column:
                  name: created_by
                  type: UUID
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_by
                  type: UUID
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: is_deleted
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: deleted_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: deleted_by
                  type: UUID
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: permissions
                  type: JSONB
                  constraints:
                    nullable: false
              - column:
                  name: is_system
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: org_id
                  type: UUID
        - createIndex:
            schemaName: resto_organization
            tableName: roles
            indexName: idx_role_org
            where: is_deleted = false
            columns:
              - column:
                  name: org_id

        # ==================== org_settings ====================
        - createTable:
            schemaName: resto_organization
            tableName: org_settings
            remarks: Local org settings table (temp until setting-service is built)
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_org_settings
              - column:
                  name: created_by
                  type: UUID
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_by
                  type: UUID
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: org_id
                  type: UUID
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_org_settings_org
              - column:
                  name: order_mode
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: customer_photo_required
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: payment_timing
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
              - column:
                  name: customer_theme
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

        # ==================== sections ====================
        - createTable:
            schemaName: resto_organization
            tableName: sections
            remarks: Local section table (temp until table-service is built)
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_sections
              - column:
                  name: created_by
                  type: UUID
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_by
                  type: UUID
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: is_deleted
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: deleted_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: deleted_by
                  type: UUID
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: org_id
                  type: UUID
                  constraints:
                    nullable: false
        - createIndex:
            schemaName: resto_organization
            tableName: sections
            indexName: idx_section_org
            where: is_deleted = false
            columns:
              - column:
                  name: org_id

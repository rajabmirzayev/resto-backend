databaseChangeLog:
  - changeSet:
      id: 003-create-users-table
      author: rajabmirzayev
      changes:
        - createTable:
            tableName: users
            remarks: User table for user-service
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_users
              - column:
                  name: created_by
                  type: UUID
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_by
                  type: UUID
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: is_deleted
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: deleted_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: deleted_by
                  type: UUID
              - column:
                  name: keycloak_id
                  type: VARCHAR(255)
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: username
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(255)
              - column:
                  name: phone
                  type: VARCHAR(50)
              - column:
                  name: role
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: role_id
                  type: UUID
              - column:
                  name: org_id
                  type: UUID
              - column:
                  name: avatar
                  type: VARCHAR(512)
              - column:
                  name: is_active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: users
            columnNames: keycloak_id
            constraintName: uq_users_keycloak_id
        - createIndex:
            tableName: users
            indexName: idx_user_username
            unique: true
            where: is_deleted = false
            columns:
              - column:
                  name: username
        - createIndex:
            tableName: users
            indexName: idx_user_org
            where: is_deleted = false
            columns:
              - column:
                  name: org_id
        - createIndex:
            tableName: users
            indexName: idx_user_role
            columns:
              - column:
                  name: role

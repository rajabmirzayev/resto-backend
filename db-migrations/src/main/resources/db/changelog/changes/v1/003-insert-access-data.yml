        # ==================== Role permissions ====================
        - sql:
            sql: |
              INSERT INTO resto_access.role_permissions (role_id, permission_id, created_at)
              SELECT r.id, p.id, now()
              FROM resto_access.roles r
              JOIN resto_access.permissions p ON TRUE
              WHERE r.code IN ('SUPER_ADMIN', 'ORG_ADMIN');

              INSERT INTO resto_access.role_permissions (role_id, permission_id, created_at)
              SELECT r.id, p.id, now()
              FROM resto_access.roles r
              JOIN resto_access.permissions p ON p.code NOT LIKE 'organization.%'
              WHERE r.code = 'ADMIN_DEFAULT';

              INSERT INTO resto_access.role_permissions (role_id, permission_id, created_at)
              SELECT r.id, p.id, now()
              FROM resto_access.roles r
              JOIN resto_access.permissions p ON p.code IN ('dashboard.view', 'table.view', 'table.status', 'order.view', 'order.create', 'order.manage', 'waiter.view', 'waiter.manage')
              WHERE r.code = 'WAITER_DEFAULT';

              INSERT INTO resto_access.role_permissions (role_id, permission_id, created_at)
              SELECT r.id, p.id, now()
              FROM resto_access.roles r
              JOIN resto_access.permissions p ON p.code IN ('kitchen.view', 'kitchen.manage', 'order.view')
              WHERE r.code = 'KITCHEN_DEFAULT';


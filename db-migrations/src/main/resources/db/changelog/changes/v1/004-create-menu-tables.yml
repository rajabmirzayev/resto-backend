databaseChangeLog:
  - changeSet:
      id: 004-create-menu-tables
      author: rajabmirzayev
      changes:
        # ==================== menu_categories ====================
        - createTable:
            schemaName: tabler_menu
            tableName: menu_categories
            remarks: Menu categories
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_menu_categories
              - column:
                  name: created_by
                  type: UUID
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_by
                  type: UUID
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: is_deleted
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: deleted_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: deleted_by
                  type: UUID
              - column:
                  name: name
                  type: JSONB
                  constraints:
                    nullable: false
              - column:
                  name: icon
                  type: VARCHAR(50)
              - column:
                  name: sort_order
                  type: INTEGER
              - column:
                  name: org_id
                  type: UUID
                  constraints:
                    nullable: false
        - createIndex:
            schemaName: tabler_menu
            tableName: menu_categories
            indexName: idx_category_org
            where: is_deleted = false
            columns:
              - column:
                  name: org_id

        # ==================== menu_items ====================
        - createTable:
            schemaName: tabler_menu
            tableName: menu_items
            remarks: Menu items
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_menu_items
              - column:
                  name: created_by
                  type: UUID
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_by
                  type: UUID
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: is_deleted
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: deleted_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: deleted_by
                  type: UUID
              - column:
                  name: name
                  type: JSONB
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: JSONB
              - column:
                  name: price
                  type: DECIMAL(10, 2)
                  constraints:
                    nullable: false
              - column:
                  name: category_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: image_url
                  type: VARCHAR(512)
              - column:
                  name: is_available
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: preparation_time
                  type: INTEGER
              - column:
                  name: org_id
                  type: UUID
                  constraints:
                    nullable: false
        - createIndex:
            schemaName: tabler_menu
            tableName: menu_items
            indexName: idx_item_org
            where: is_deleted = false
            columns:
              - column:
                  name: org_id
        - createIndex:
            schemaName: tabler_menu
            tableName: menu_items
            indexName: idx_item_category
            where: is_deleted = false
            columns:
              - column:
                  name: category_id
        - createIndex:
            schemaName: tabler_menu
            tableName: menu_items
            indexName: idx_item_available
            where: is_deleted = false
            columns:
              - column:
                  name: org_id
              - column:
                  name: is_available

common:
  error:
    service-key: ORDER_MS

spring:
  application:
    name: order-service

  datasource:
    url: ${ORDER_DB_URL:jdbc:postgresql://localhost:5432/tabler_order}
    username: ${ORDER_DB_USERNAME:postgres}
    password: ${ORDER_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  messages:
    basename: messages

server:
  port: ${ORDER_SERVER_PORT:8107}
  servlet:
    context-path: /api/order-ms

service:
  table:
    url: ${TABLE_SERVICE_URL:http://localhost:8106}
  menu:
    url: ${MENU_SERVICE_URL:http://localhost:8105}
  setting:
    url: ${SETTING_SERVICE_URL:http://localhost:8111}

logging:
  level:
    az.codlab.order: DEBUG

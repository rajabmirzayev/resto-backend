common:
  error:
    service-key: AUTH

spring:
  application:
    name: auth-gateway

  web:
    cors:
      allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000,http://localhost:5173}
      allowed-methods: '*'
      allowed-headers: '*'
      allow-credentials: true
      max-age: 3600

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${keycloak.server-url}/realms/${keycloak.realm}
          jwk-set-uri: ${keycloak.server-url}/realms/${keycloak.realm}/protocol/openid-connect/certs

keycloak:
  server-url: ${AUTH_KEYCLOAK_URL:http://localhost:8080}
  realm: ${AUTH_KEYCLOAK_REALM:tabler}
  client-id: ${AUTH_KEYCLOAK_CLIENT_ID:tabler-auth}
  client-secret: ${AUTH_KEYCLOAK_CLIENT_SECRET}
  token-uri: ${keycloak.server-url}/realms/${keycloak.realm}/protocol/openid-connect/token
  logout-uri: ${keycloak.server-url}/realms/${keycloak.realm}/protocol/openid-connect/logout
  connect-timeout-ms: ${AUTH_KEYCLOAK_CONNECT_TIMEOUT:5000}
  read-timeout-ms: ${AUTH_KEYCLOAK_READ_TIMEOUT:10000}

auth:
  super-admin-role: SUPER_ADMIN

server:
  port: ${AUTH_SERVER_PORT:8002}
  servlet:
    context-path: /api/auth-ms

logging:
  level:
    az.birim.auth: DEBUG

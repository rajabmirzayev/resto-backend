common:
  error:
    service-key: MENU_MS

app:
  storage:
    base-dir: ${MENU_STORAGE_DIR:./data/menu-images}
    public-base-url: ${MENU_PUBLIC_BASE_URL:http://localhost:8105}

spring:
  application:
    name: menu-service

  datasource:
    url: ${MENU_DB_URL:jdbc:postgresql://localhost:5432/tabler?currentSchema=tabler_menu}
    username: ${MENU_DB_USERNAME:postgres}
    password: ${MENU_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  messages:
    basename: messages

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

server:
  port: ${MENU_SERVER_PORT:8105}
  servlet:
    context-path: /api/menu-ms

logging:
  level:
    az.codlab.menu: DEBUG

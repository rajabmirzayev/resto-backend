common:
  error:
    service-key: MENU_MS

app:
  storage:
    base-dir: ${MENU_STORAGE_DIR:./data/menu-images}
    public-base-url: ${MENU_PUBLIC_BASE_URL:http://localhost:8001}

spring:
  application:
    name: menu-service

  datasource:
    url: ${MENU_DB_URL:jdbc:postgresql://localhost:5432/resto?currentSchema=resto_menu}
    username: ${MENU_DB_USERNAME:postgres}
    password: ${MENU_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000


  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  messages:
    basename: messages,i18n/messages

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

server:
  port: ${MENU_SERVER_PORT:8105}
  servlet:
    context-path: /api/menu-ms

logging:
  level:
    az.flowix.menu: DEBUG


security:
  internal-auth:
    secret: ${INTERNAL_AUTH_SECRET}

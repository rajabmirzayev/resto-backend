common:
  error:
    service-key: ORG

spring:
  application:
    name: organization-service

  datasource:
    url: ${ORG_DB_URL:jdbc:postgresql://localhost:5432/resto?currentSchema=resto_organization}
    username: ${ORG_DB_USERNAME:postgres}
    password: ${ORG_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000


  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  messages:
    basename: messages,i18n/messages

service:
  access:
    url: ${ACCESS_SERVICE_URL:http://localhost:8120}
  setting:
    url: ${SETTING_SERVICE_URL:http://localhost:8111}
  table:
    url: ${TABLE_SERVICE_URL:http://localhost:8106}
  order:
    url: ${ORDER_SERVICE_URL:http://localhost:8107}

server:
  port: ${ORG_SERVER_PORT:8102}
  servlet:
    context-path: /api/organization-ms

logging:
  level:
    az.flowix.organization: DEBUG

feign:
  client:
    config:
      default:
        connect-timeout: 5000
        read-timeout: 10000
        loggerLevel: BASIC


security:
  internal-auth:
    secret: ${INTERNAL_AUTH_SECRET}
